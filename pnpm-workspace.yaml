allowBuilds:
  msw: set this to true or false
blockExoticSubdeps: true

catalog:
  '@standard-schema/spec': 1.0.0
  '@tanstack/react-query': 5.101.4
  '@thaz/oxfmt-config': 1.0.0-rc.3
  '@thaz/oxlint-config': 1.0.0-rc.2
  '@thaz/temporal-util': 1.0.0-rc.3
  '@thaz/typescript-config': 1.0.0-rc.2
  '@types/node': 24.13.3
  '@types/react': 19.2.18
  '@vitejs/plugin-react': 6.0.5
  '@vitest/coverage-istanbul': 4.1.10
  '@vitest/browser-playwright': 4.1.10
  '@vitest/ui': 4.1.10
  jsdom: 30.0.1
  msw: 2.14.6
  playwright: 1.62.1
  react: 19.2.8
  spin-delay: 2.0.1
  temporal-polyfill: 1.0.3
  typescript: 6.0.3
  use-deep-compare: 1.3.0
  valibot: 1.4.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plugin-externalize-deps: 0.10.0
  vite-plus: 0.2.9
  vitest: 4.1.10
  vitest-browser-react: 2.2.0

catalogMode: prefer
# Watch this issue: https://github.com/pnpm/pnpm/issues/11238
minimumReleaseAge: 4320 # 3 days just to be safe with the uptick of supply chain attacks

minimumReleaseAgeExclude:
  - '@thaz/oxfmt-config@1.0.0-rc.3'
  - '@thaz/oxlint-config@1.0.0-rc.2'
  - '@thaz/temporal-util@1.0.0-rc.3'
  - '@thaz/typescript-config@1.0.0-rc.2'
  - '@voidzero-dev/vite-plus-core@0.2.9'
  - '@voidzero-dev/vite-plus-darwin-arm64@0.2.9'
  - '@voidzero-dev/vite-plus-darwin-x64@0.2.9'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@0.2.9'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@0.2.9'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@0.2.9'
  - '@voidzero-dev/vite-plus-linux-x64-musl@0.2.9'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@0.2.9'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@0.2.9'
  - vite-plus@0.2.9

overrides:
  vite: 'catalog:'
  vitest: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
